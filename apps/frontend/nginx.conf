server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA : createBrowserRouter (React Router) gère la navigation côté client via
    # l'History API. Sans ce fallback, un rafraîchissement sur /products ou /sales
    # renverrait un 404 Nginx (ces chemins n'existent pas en tant que fichiers réels).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache long pour les assets fingerprintés par Vite (hash dans le nom de fichier
    # -> un nouveau déploiement génère un nouveau nom, donc pas de risque de cache périmé).
    location ~* \.(?:css|js|svg|woff2?|png|jpg|jpeg|ico)$ {
        expires 7d;
        access_log off;
    }
}
