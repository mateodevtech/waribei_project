services:
  mongodb:
    image: mongo:7
    container_name: waristock-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./apps/backend
    container_name: waristock-backend
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      PORT: 3000
      # "mongodb" = nom du service ci-dessus, résolu via le réseau interne Docker
      # (rien à voir avec "localhost", qui à l'intérieur de ce conteneur pointerait sur lui-même).
      MONGODB_URI: mongodb://mongodb:27017/waristock
      JWT_SECRET: ${JWT_SECRET:-change-this-secret-in-production}
      JWT_EXPIRES_IN_SECONDS: ${JWT_EXPIRES_IN_SECONDS:-86400}
    ports:
      - "3000:3000"

  frontend:
    build:
      context: ./apps/frontend
      args:
        # Valeur côté NAVIGATEUR (pas le réseau interne Docker) — voir le commentaire
        # dans apps/frontend/Dockerfile. Modifiable via un fichier .env à la racine.
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
    container_name: waristock-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

  # Service utilitaire, PAS lancé par défaut (`docker compose up` l'ignore) : insère les
  # données initiales une seule fois. Lancement explicite : `docker compose run --rm seed`.
  seed:
    build:
      context: ./apps/backend
    container_name: waristock-seed
    profiles: ["tools"]
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      MONGODB_URI: mongodb://mongodb:27017/waristock
      JWT_SECRET: ${JWT_SECRET:-change-this-secret-in-production}
    command: ["node", "dist/seed/seed.js"]

volumes:
  mongo-data:
